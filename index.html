<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Goldie — Golden Hour Sessions</title>
<meta name="theme-color" content="#0B0F1A" />

<!-- Fonts: Yatra One (Devanagari display) + Manrope (UI body) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Yatra+One&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ BACKGROUND ARTWORK ============
       Image file lives at: /images/background.jpg
       Swap that file (same name) to change the background,
       or edit the url(...) in style.css under .bg img — wait,
       we use an <img> tag below so you can just replace the file. -->
  <div class="bg">
    <img src="images/background.jpg" alt="" />
    <div class="bg-gradient-top"></div>
    <div class="bg-gradient-bottom"></div>
  </div>

  <!-- ============ TOP BAR ============
       Clock + Instagram sit together in the top-left corner.
       YouTube Music stays top-right. Middle is left empty. -->
  <header class="topbar">
    <div class="topbar-left">
      <div id="clock" class="glass pill clock">
        <span id="clock-time">--:--</span>
        <span id="clock-date" class="clock-date"></span>
      </div>

      <a
        id="instagram-btn"
        class="glass pill icon-btn"
        href="https://instagram.com/sauravhhh"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Instagram @sauravhhh"
      >
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor"/>
        </svg>
      </a>
    </div>

    <div class="topbar-right">
      <a
        id="yt-music-btn"
        class="glass pill yt-btn"
        href="https://youtube.com/playlist?list=PL3cTse0YhM79CcS9HP_BpzPkuJe94EYV7"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z" fill="#D9662F"/>
          <path d="M9.6 15.5V8.5L15.8 12l-6.2 3.5Z" fill="#0B0F1A"/>
        </svg>
        <span>YouTube Music</span>
        <span class="arrow">↗</span>
      </a>
    </div>
  </header>

  <!-- ============ TITLE (upper-center, below top bar) ============ -->
  <main class="hero">
    <div class="hero-glow"></div>
    <h1 class="title">Goldie</h1>
    <p class="subtitle">Golden Hour Sessions</p>
  </main>

  <!-- ============ TAP TO START (autoplay policy) ============ -->
  <button id="tap-to-start" class="tap-overlay hidden">
    <span class="tap-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5.14v13.72c0 .8.87 1.3 1.57.9l11.14-6.86a1 1 0 0 0 0-1.7L9.57 4.24A1 1 0 0 0 8 5.14Z"/>
      </svg>
    </span>
    <span class="tap-title">tap to listen</span>
    <span class="tap-sub">tap to listen</span>
  </button>

  <!-- ============ HIDDEN YOUTUBE IFRAME PLAYER ============
       This div is turned into the real YouTube <iframe> by the
       IFrame Player API (see script.js). It is kept in the DOM
       but visually hidden — audio still plays normally, we just
       don't show YouTube's own video chrome. -->
  <div id="yt-player-hidden">
    <div id="yt-player"></div>
  </div>

  <!-- ============ FLOATING PLAYER ============ -->
  <footer class="player glass">
    <div class="progress-row">
      <span id="time-current" class="time">0:00</span>
      <div id="progress-bar" class="progress-bar">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-handle" class="progress-handle"></div>
      </div>
      <span id="time-duration" class="time">0:00</span>
    </div>

    <div class="track-row">
      <div class="thumb">
        <img id="track-thumb" src="" alt="" />
      </div>

      <div class="track-info">
        <p id="track-title" class="track-title">It's loading…</p>
        <p id="track-artist" class="track-artist"></p>
      </div>

      <div class="controls">
        <button id="btn-next" class="ctrl-btn" aria-label="Next track">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 10-6v12z"/>
          </svg>
        </button>

        <button id="btn-play" class="ctrl-btn play-btn" aria-label="Play">
          <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="icon-play">
            <path d="M8 5.14v13.72c0 .8.87 1.3 1.57.9l11.14-6.86a1 1 0 0 0 0-1.7L9.57 4.24A1 1 0 0 0 8 5.14Z"/>
          </svg>
          <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="icon-pause hidden">
            <path d="M7 5h4v14H7zm6 0h4v14h-4z"/>
          </svg>
        </button>

        <button id="btn-prev" class="ctrl-btn" aria-label="Previous track">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 10-6v12z" transform="scale(-1,1) translate(-19.5,0)"/>
          </svg>
        </button>

        <button id="btn-playlist" class="ctrl-btn" aria-label="Open playlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- ============ PLAYLIST BOTTOM SHEET ============ -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="playlist-sheet" class="playlist-sheet glass-strong">
    <div class="sheet-handle-row">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-header">
      <h2>Playlist</h2>
      <button id="btn-close-sheet" aria-label="Close playlist">✕</button>
    </div>
    <div id="sheet-list" class="sheet-list thin-scroll"></div>
  </div>

  <!-- YouTube IFrame Player API loads itself via script.js -->
  <script src="script.js"></script>
</body>
            </html>
